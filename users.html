{% extends "admin/base.html" %}
{% block content %}
<div class="admin-header"><h1>Users</h1></div>
<table class="admin-table">
  <thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th><th>Joined</th></tr></thead>
  <tbody>
    {% for u in users %}
    <tr>
      <td>{{ u.id }}</td>
      <td>{{ u.username }}</td>
      <td>{{ u.email }}</td>
      <td><span class="badge {% if u.role=='admin' %}badge--confirmed{% else %}badge--pending{% endif %}">{{ u.role }}</span></td>
      <td>{{ u.created_at[:10] }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
